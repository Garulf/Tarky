[tox]
envlist = lint, type, py38, py314

[testenv]
skip_install = true
deps = -r requirements-dev.txt
commands = python -m pytest {posargs}

[testenv:lint]
description = Run all linting checks
deps = flake8
commands = flake8 src tests

[testenv:type]
description = Run all type checks
deps =
    -r requirements.txt
    mypy
commands = mypy src/plugin

[testenv:screenshots]
description = Render the README screenshots into .github/assets
basepython = python3.12
deps = flow-render==0.15.0
passenv = TMPDIR
commands = python docs/screenshots/render.py
